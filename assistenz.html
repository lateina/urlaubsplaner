<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urlaubsplaner Assistenzärzte 2026/2027</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --text-main: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --success-color: #10b981;
            --status-vacation: #3b82f6;
            --status-trip: #8b5cf6;
            --status-training: #f97316;
            --status-custom: #64748b;
            --status-weekend: #f1f5f9;
            --radius-md: 8px;
            --radius-lg: 12px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            background: var(--surface-color);
            padding: 10px 15px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
        }

        h1 { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }

        .controls { display: flex; gap: 10px; }

        button {
            padding: 8px 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: var(--surface-color);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        button.primary { background: var(--primary-color); color: white; border: none; }

        .calendar-container {
            display: grid;
            overflow-x: auto;
            overflow-y: auto;
            position: relative;
            width: 100%;
            height: auto;
            max-height: calc(100vh - 250px);
            grid-template-columns: 200px repeat(762, 40px);
            grid-template-rows: 20px 20px 30px;
            grid-auto-rows: minmax(50px, auto);
            padding-bottom: 80px;
        }

        .sticky-col {
            position: -webkit-sticky !important;
            position: sticky !important;
            left: 0 !important;
            background-color: #ffffff !important;
            z-index: 100 !important;
            border-right: 2px solid var(--border-color);
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
            min-width: 200px;
            transform: translateZ(0);
        }

        .sticky-header {
            position: -webkit-sticky !important;
            position: sticky !important;
            top: 0 !important;
            background-color: var(--surface-color) !important;
            z-index: 90 !important;
            border-bottom: 1px solid var(--border-color);
        }

        .sticky-corner { top: 0 !important; left: 0 !important; z-index: 110 !important; }

        .cell {
            padding: 5px;
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
        }

        .header-cell { font-weight: 600; color: var(--text-secondary); flex-direction: column; }

        .month-header {
            grid-row: 1; top: 0; background: #f1f5f9; font-weight: 700; text-transform: uppercase;
            font-size: 0.7rem; letter-spacing: 0.05em; line-height: 20px;
        }

        .day-header { grid-row: 3; top: 40px; align-items: center; justify-content: flex-start; padding: 5px 0; }

        .employee-row-header { justify-content: flex-start; padding-left: 15px; font-weight: 600; background: var(--surface-color); position: relative; }

        .day-cell { cursor: pointer; transition: background 0.1s; position: relative; }
        .cell-text { font-size: 0.6rem; color: white; pointer-events: none; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 100%; padding: 0 2px; }

        .weekend { background-color: var(--status-weekend); }
        .holiday { background-color: #fecaca; }
        .day-header.holiday { background-color: #fecaca !important; }
        
        .school-holiday { border-top: 3px solid #94a3b8; }
        .holiday.school-holiday { border-top: 3px solid #64748b; }

        .day-cell.status-vacation { background-color: var(--status-vacation) !important; color: white !important; }
        .day-cell.status-trip { background-color: var(--status-trip) !important; color: white !important; }
        .day-cell.status-training { background-color: var(--status-training) !important; color: white !important; }
        .day-cell.status-custom { background-color: var(--status-custom) !important; color: white !important; }

        .month-nav { display: flex; gap: 5px; margin-bottom: 20px; flex-wrap: wrap; }
        .month-nav button { padding: 4px 10px; font-size: 0.8rem; }

        #custom-tooltip {
            position: fixed; background: #333; color: white; padding: 6px 10px; border-radius: 4px;
            font-size: 0.8rem; z-index: 1000; pointer-events: none; display: none; max-width: 200px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5); display: none; align-items: center; justify-content: center; z-index: 1000;
        }

        .modal { background: var(--surface-color); padding: 25px; border-radius: var(--radius-lg); width: 450px; max-width: 95vw; box-shadow: var(--shadow-md); }
        .modal h2 { margin-bottom: 20px; font-size: 1.3rem; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: var(--radius-md); }

        body.pre-login header, body.pre-login .month-nav, body.pre-login #calendarView, body.pre-login .tab-container { display: none !important; }

        .tab-container { display: flex; border-bottom: 2px solid #ddd; margin-bottom: 15px; background: white; padding: 10px 15px 0; }
        .tab-button { padding: 10px 20px; cursor: pointer; background: transparent; border: none; border-bottom: 3px solid transparent; font-size: 1rem; font-weight: bold; color: #64748b; margin-right: 10px; }
        .tab-button.active { color: var(--primary-color); border-bottom-color: var(--primary-color); }

        @media (max-width: 768px) {
            body { padding: 4px; }
            header { padding: 6px 10px; margin-bottom: 6px; }
            .header-top { display: flex; flex-direction: row; justify-content: space-between; align-items: center; gap: 10px; }
            h1 { font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .tab-container { margin-bottom: 6px; padding-top: 4px; }
            .controls { display: flex; gap: 4px; }
            .controls button { padding: 4px 6px; font-size: 0.7rem; width: auto; }
            .calendar-container { grid-template-columns: 80px repeat(762, 40px); max-height: calc(100vh - 350px); }
            .sticky-col { min-width: 80px; width: 80px; font-size: 0.75rem; }
            .employee-row-header { padding-left: 5px; line-height: 1.2; word-break: break-word; }
            .month-nav { overflow-x: auto; white-space: nowrap; padding-bottom: 5px; -webkit-overflow-scrolling: touch; display: block; }
            .month-nav button { display: inline-block; padding: 8px 15px; margin-right: 5px; }
            #btnAddAbsence { width: 100%; margin-left: 0 !important; padding: 10px !important; grid-column: span 2; }
        }
    </style>
</head>

<body class="pre-login">
    <header>
        <div class="header-top">
            <h1>Urlaubsplaner Assistenzärzte</h1>
            <div class="controls">
                <button id="btnExport" onclick="app.exportData()">Export JSON</button>
                <button id="btnImport" class="primary" onclick="document.getElementById('fileInput').click()">Import JSON</button>
                <input type="file" id="fileInput" style="display:none" onchange="app.importData(this)">
            </div>
        </div>
        <div class="tab-container">
            <button id="tab-calendar" class="tab-button active" onclick="app.switchTab('calendar')">Kalenderansicht</button>
            <button id="tab-summary" class="tab-button" onclick="app.switchTab('summary')" style="display:none;">Zusammenfassung</button>
            <button id="tab-status" class="tab-button" onclick="app.switchTab('status')" style="display:none;">Eingabestatus</button>
            <button id="tab-admin" class="tab-button" onclick="app.switchTab('admin')" style="display:none;">Verwaltung</button>
        </div>
    </header>

    <div id="calendarView">
        <div class="calendar-toolbar" style="background:white; padding:10px; border-radius:8px; margin-bottom:10px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
            <button id="btnAddAbsence" class="primary" onclick="app.openModal()">+ Eintragen</button>
            <div id="absenceInputModePanel" style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                <strong style="font-size: 0.9rem">Modus:</strong>
                <label onmouseenter="app.showSimpleTip(event, 'Urlaub')" onmouseleave="app.hideTip()"><input type="radio" name="mode" value="U" checked onchange="app.setMode('U')"> U</label>
                <label onmouseenter="app.showSimpleTip(event, 'Dienstreise')" onmouseleave="app.hideTip()"><input type="radio" name="mode" value="D" onchange="app.setMode('D')"> D</label>
                <label onmouseenter="app.showSimpleTip(event, 'Fortbildung')" onmouseleave="app.hideTip()"><input type="radio" name="mode" value="F" onchange="app.setMode('F')"> F</label>
                <label onmouseenter="app.showSimpleTip(event, 'Sonstiges')" onmouseleave="app.hideTip()"><input type="radio" name="mode" value="S" onchange="app.setMode('S')"> S</label>
                <input type="text" id="customText" placeholder="Art..." title="Erläuterung zur Abwesenheit" style="padding: 4px; border: 1px solid #ccc; border-radius: 4px;" oninput="app.setCustomText(this.value)">
                <input type="text" id="vertreterText" placeholder="Vertreter..." title="Name der Vertretung" style="padding: 4px; border: 1px solid #ccc; border-radius: 4px;" oninput="app.setVertreterText(this.value)">
            </div>
        </div>
        <div class="month-nav" id="yearNav"></div>
        <div class="month-nav" id="monthNav"></div>
        <div id="calendar" class="calendar-container"></div>
    </div>

    <div id="adminView" style="display:none; padding:20px;"></div>
    <div id="summaryView" style="display:none; padding:20px;"><textarea id="exportSummary" readonly style="width:100%; height:400px;"></textarea></div>
    <div id="statusView" style="display:none; padding:20px;"><textarea id="statusSummary" readonly style="width:100%; height:400px;"></textarea></div>

    <div id="loginModal" class="modal-overlay" style="display:flex;">
        <div class="modal">
            <h2>Anmelden</h2>
            <div class="form-group">
                <label>Name:</label>
                <div style="position:relative;">
                    <input type="text" id="loginSearch" placeholder="Name suchen..." oninput="app.filterLoginEmployees()" autocomplete="off">
                    <div id="loginResults" style="background:white; border:1px solid #ddd; max-height:150px; overflow-y:auto; position:absolute; left:0; right:0; z-index:100; display:none; box-shadow: var(--shadow-md);"></div>
                </div>
                <input type="hidden" id="loginSelect">
            </div>
            <div class="form-group"><label>PIN:</label><input type="password" id="loginPwdInput"></div>
            <div class="form-group"><label>Master Key:</label><input type="password" id="apiKeyInput"></div>
            <button class="primary" onclick="app.processLogin()" style="width:100%; padding:12px;">Anmelden</button>
        </div>
    </div>

    <div id="addModal" class="modal-overlay">
        <div class="modal">
            <h2>Abwesenheit eintragen</h2>
            <div class="form-group"><label>Mitarbeiter:</label><select id="modalEmp"></select></div>
            <div class="form-group"><label>Art:</label><select id="modalType"><option value="U">Urlaub</option><option value="D">Dienstreise</option><option value="F">Fortbildung</option><option value="S">Sonstiges</option></select></div>
            <div class="form-group"><label>Beschreibung:</label><input type="text" id="modalText"></div>
            <div class="form-group"><label>Vertreter:</label><input type="text" id="modalVertreter"></div>
            <div class="form-group"><label>Von:</label><input type="date" id="modalStart"></div>
            <div class="form-group"><label>Bis:</label><input type="date" id="modalEnd"></div>
            <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:20px;">
                <button onclick="document.getElementById('addModal').style.display='none'">Abbrechen</button>
                <button class="primary" onclick="app.addRange()">Speichern</button>
            </div>
        </div>
    </div>

    <div id="custom-tooltip"></div>

    <script>
        function getBavarianHolidays(year) {
            function getEaster(year) {
                const a = year % 19, b = Math.floor(year / 100), c = year % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
                const month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
                return new Date(year, month - 1, day);
            }
            const easter = getEaster(year);
            const add = (d, n) => { let r = new Date(d); r.setDate(r.getDate() + n); return `${r.getFullYear()}-${String(r.getMonth()+1).padStart(2,'0')}-${String(r.getDate()).padStart(2,'0')}`; };
            return {
                [`${year}-01-01`]: 'Neujahr', [`${year}-01-06`]: 'Hl. 3 Könige', [`${year}-05-01`]: 'Tag der Arbeit', [`${year}-08-15`]: 'Mariä Himmelfahrt', [`${year}-10-03`]: 'Tag d. dt. Einheit', [`${year}-11-01`]: 'Allerheiligen', [`${year}-12-25`]: '1. Weihnachtstag', [`${year}-12-26`]: '2. Weihnachtstag',
                [add(easter, -2)]: 'Karfreitag', [add(easter, 1)]: 'Ostermontag', [add(easter, 39)]: 'Christi Himmelfahrt', [add(easter, 50)]: 'Pfingstmontag', [add(easter, 60)]: 'Fronleichnam'
            };
        }

        const CONFIG = {
            years: [2026, 2027, 2028], binId: '699ffb53ae596e708f4b3de5', apiKey: localStorage.getItem('jsonbin_key') || '', employees: [], holidays: {},
            schoolHolidays: [
                { start: '2026-01-01', end: '2026-01-05', name: 'Weihnachtsferien' }, { start: '2026-02-16', end: '2026-02-20', name: 'Winterferien' }, { start: '2026-03-30', end: '2026-04-10', name: 'Osterferien' }, { start: '2026-05-26', end: '2026-06-05', name: 'Pfingstferien' }, { start: '2026-08-03', end: '2026-09-14', name: 'Sommerferien' }, { start: '2026-11-02', end: '2026-11-06', name: 'Herbstferien' }, { start: '2026-12-24', end: '2027-01-08', name: 'Weihnachtsferien' }, { start: '2027-02-08', end: '2027-02-12', name: 'Winterferien' }, { start: '2027-03-22', end: '2027-04-02', name: 'Osterferien' }, { start: '2027-05-18', end: '2027-05-28', name: 'Pfingstferien' }, { start: '2027-08-02', end: '2027-09-13', name: 'Sommerferien' }, { start: '2027-11-02', end: '2027-11-05', name: 'Herbstferien' }, { start: '2027-12-24', end: '2028-01-07', name: 'Weihnachtsferien' }
            ]
        };
        CONFIG.years.forEach(y => Object.assign(CONFIG.holidays, getBavarianHolidays(y)));

        class DataService {
            static async load() {
                try { const res = await fetch(`https://api.jsonbin.io/v3/b/${CONFIG.binId}/latest`, { headers: { 'X-Master-Key': CONFIG.apiKey } }); return (await res.json()).record; } catch (e) { return null; }
            }
            static async save(state) {
                try { await fetch(`https://api.jsonbin.io/v3/b/${CONFIG.binId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'X-Master-Key': CONFIG.apiKey }, body: JSON.stringify({ employees: CONFIG.employees, state }) }); } catch (e) {}
            }
        }

        class App {
            constructor() {
                this.currentUser = null; this.state = {}; this.isDragging = false; this.dragLock = false; this.currentMode = 'U';
                this.currentText = ''; this.currentVertreterText = '';
                this.dates = this.generateDates();
                this.initApp();
                document.getElementById('calendar').addEventListener('scroll', () => this.updateNavHighlighting(), { passive: true });
                document.addEventListener('mouseup', () => { 
                    if (this.isDragging) { 
                        this.isDragging = false; 
                        this.dragLock = true; 
                        setTimeout(() => this.dragLock = false, 200);
                        this.saveState(); 
                        this.render(); 
                    } 
                });
            }

            formatDate(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

            generateDates() {
                const res = [];
                CONFIG.years.forEach(y => {
                    let d = new Date(y, 0, 1);
                    while (d.getFullYear() === y) {
                        if (y === 2028 && d.getMonth() > 0) break;
                        const s = this.formatDate(d), sh = CONFIG.schoolHolidays.find(h => s >= h.start && s <= h.end);
                        res.push({ year: y, dateStr: s, day: d.getDate(), month: d.getMonth(), weekday: d.getDay(), isWeekend: d.getDay() === 0 || d.getDay() === 6, holiday: CONFIG.holidays[s], isSchoolHoliday: !!sh, schoolHoliday: sh ? sh.name : null });
                        d.setDate(d.getDate() + 1);
                    }
                });
                return res;
            }

            async initApp() {
                const storedKey = localStorage.getItem('jsonbin_key');
                if (storedKey) { CONFIG.apiKey = storedKey; document.getElementById('apiKeyInput').value = storedKey; }
                const data = await DataService.load();
                if (data) { CONFIG.employees = data.employees; this.state = data.state || {}; }
                this.initUI();
                this.showLoginModal();
            }

            initUI() {
                const yNav = document.getElementById('yearNav'), mNav = document.getElementById('monthNav');
                CONFIG.years.forEach(y => { const b = document.createElement('button'); b.innerText = y; b.id = `btn-year-${y}`; b.onclick = () => this.setYear(y); yNav.appendChild(b); });
                ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'].forEach((m, i) => { const b = document.createElement('button'); b.innerText = m; b.id = `btn-month-${i}`; b.onclick = () => this.scrollToMonth(i, true); mNav.appendChild(b); });
            }

            showLoginModal() {
                this._loginOptions = [{ id: 'admin', name: 'Admin' }, { id: 'sekretariat', name: 'Sekretariat' }, ...CONFIG.employees.filter(e => e.id !== 'admin' && e.active !== false).map(e => ({ id: e.id, name: e.name }))];
                document.getElementById('loginSearch').onfocus = () => this.filterLoginEmployees();
            }

            filterLoginEmployees() {
                const q = document.getElementById('loginSearch').value.toLowerCase(), res = document.getElementById('loginResults');
                res.innerHTML = '';
                const matches = this._loginOptions.filter(o => !q || o.name.toLowerCase().includes(q));
                if (matches.length === 0) { res.style.display = 'none'; return; }
                matches.forEach(o => {
                    const i = document.createElement('div'); i.textContent = o.name; i.style.padding = '10px'; i.style.cursor = 'pointer'; i.onmousedown = () => { document.getElementById('loginSearch').value = o.name; document.getElementById('loginSelect').value = o.id; res.style.display = 'none'; };
                    res.appendChild(i);
                });
                res.style.display = 'block';
            }

            async processLogin() {
                const id = document.getElementById('loginSelect').value, key = document.getElementById('apiKeyInput').value.trim();
                if (!id || !key) return alert('Daten fehlen');
                localStorage.setItem('jsonbin_key', key); CONFIG.apiKey = key; this.currentUser = id;
                document.getElementById('loginModal').style.display = 'none'; document.body.classList.remove('pre-login');
                
                const isAdmin = (id === 'admin' || id === 'sekretariat');
                const isRealAdmin = (id === 'admin');
                
                document.querySelector('.tab-container').style.display = isAdmin ? 'flex' : 'none';
                
                // Control Export/Import button visibility
                const btnExport = document.getElementById('btnExport');
                if (btnExport) btnExport.style.display = isAdmin ? 'inline-block' : 'none';
                
                const btnImport = document.getElementById('btnImport');
                if (btnImport) btnImport.style.display = isRealAdmin ? 'inline-block' : 'none';

                document.getElementById('btnAddAbsence').style.display = (id === 'sekretariat' ? 'none' : 'inline-block');
                const mSel = document.getElementById('modalEmp'); mSel.innerHTML = '';
                const allowed = (isAdmin ? CONFIG.employees.filter(e => e.active !== false && e.id !== 'admin' && e.id !== 'sekretariat') : CONFIG.employees.filter(e => e.id === id));
                allowed.forEach(e => { const o = document.createElement('option'); o.value = e.id; o.innerText = e.name; mSel.appendChild(o); });
                this.render();
                setTimeout(() => this.scrollToMonth(new Date().getMonth(), true), 500);
            }

            checkPermission(eid) {
                if (this.currentUser === 'admin' || this.currentUser === 'sekretariat' || eid === this.currentUser) return true;
                alert('Stopp! Du kannst Abwesenheiten nur in deiner eigenen Zeile eintragen oder bearbeiten.');
                return false;
            }

            render() {
                const container = document.getElementById('calendar'); container.innerHTML = '';
                const isMobile = window.innerWidth <= 768;
                let lastM = -1, lastY = -1;

                this.dates.forEach((d, i) => {
                    if (d.month !== lastM || d.year !== lastY) {
                        const m = document.createElement('div'); m.className = 'cell header-cell sticky-header month-header'; m.innerText = new Date(d.year, d.month, 1).toLocaleString('de-DE', { month: 'long', year: 'numeric' });
                        m.id = `month-header-${d.year}-${d.month}`; m.style.gridColumnStart = i + 2;
                        let s = 1, j = i + 1; while (j < this.dates.length && this.dates[j].month === d.month && this.dates[j].year === d.year) { s++; j++; }
                        m.style.gridColumnEnd = `span ${s}`; container.appendChild(m); lastM = d.month; lastY = d.year;
                    }
                });

                const corner = document.createElement('div'); corner.className = 'cell header-cell sticky-col sticky-corner sticky-header'; corner.style.gridRow = '1 / span 3'; corner.style.gridColumn = '1'; corner.innerText = isMobile ? 'Name' : 'Mitarbeiter'; container.appendChild(corner);

                this.dates.forEach((d, i) => {
                    const h = document.createElement('div'); h.className = `cell header-cell sticky-header day-header ${d.isWeekend ? 'weekend' : ''} ${d.holiday ? 'holiday' : ''} ${d.isSchoolHoliday ? 'school-holiday' : ''}`;
                    h.innerHTML = `<span>${d.day}</span>`; h.style.gridRow = 3; h.style.gridColumn = i + 2;
                    h.onmouseenter = (ev) => this.showTip(ev, null, d.dateStr); h.onmouseleave = () => this.hideTip();
                    container.appendChild(h);
                });

                const emps = CONFIG.employees.filter(e => e.id !== 'admin' && e.id !== 'sekretariat' && e.active !== false);
                emps.forEach((e, ei) => {
                    const n = document.createElement('div'); n.className = 'cell employee-row-header sticky-col'; n.style.gridRow = ei + 4; n.style.gridColumn = '1';
                    if (isMobile) { const p = e.name.split(' '); n.innerText = p[p.length - 1]; } else n.innerText = e.name;
                    if (this.currentUser === e.id) n.style.backgroundColor = '#e0f2fe';
                    container.appendChild(n);

                    this.dates.forEach((d, di) => {
                        const c = document.createElement('div'); c.className = `cell day-cell ${d.isWeekend ? 'weekend' : ''} ${d.holiday ? 'holiday' : ''} ${d.isSchoolHoliday ? 'school-holiday' : ''}`;
                        c.style.gridRow = ei + 4; c.style.gridColumn = di + 2; c.id = `cell-${e.id}-${d.dateStr}`;
                        const s = this.state[e.id]?.[d.dateStr];
                        if (s) {
                            const t = s.type || s; c.classList.add(t === 'U' || t === 'V' ? 'status-vacation' : t === 'D' ? 'status-trip' : t === 'F' ? 'status-training' : (t === 'S' || t === 'T' ? 'status-custom' : ''));
                            if (s.text) c.innerHTML = `<span class="cell-text">${s.text}</span>`;
                        }
                        if (isMobile) { c.onclick = () => { if (!this.dragLock) this.editAbsence(e.id, d.dateStr); }; }
                        else {
                            c.onmousedown = (ev) => { if (ev.button === 0) { ev.preventDefault(); if (!this.checkPermission(e.id)) return; this.isDragging = true; this._dragVal = s ? null : { type: this.currentMode, text: this.currentText, vertreter: this.currentVertreterText }; this.setVal(e.id, d.dateStr, this._dragVal, c); } };
                            c.onmouseover = () => { if (this.isDragging) this.setVal(e.id, d.dateStr, this._dragVal, c); };
                            c.ondblclick = () => { if (!this.dragLock) this.editAbsence(e.id, d.dateStr); };
                        }
                        c.onmouseenter = (ev) => this.showTip(ev, e.id, d.dateStr); c.onmouseleave = () => this.hideTip();
                        container.appendChild(c);
                    });
                });
                this.updateNavHighlighting();
            }

            setVal(eid, d, v, cellEl = null) {
                if (!this.checkPermission(eid)) return;
                if (!this.state[eid]) this.state[eid] = {};
                if (v) this.state[eid][d] = v; else delete this.state[eid][d];
                if (cellEl) {
                    const typeMap = { 'U': 'status-vacation', 'D': 'status-trip', 'F': 'status-training', 'S': 'status-custom', 'V': 'status-vacation', 'T': 'status-custom' };
                    cellEl.classList.remove('status-vacation', 'status-trip', 'status-training', 'status-custom');
                    cellEl.innerHTML = ''; if (v) { cellEl.classList.add(typeMap[v.type] || 'status-custom'); if (v.text) cellEl.innerHTML = `<span class="cell-text">${v.text}</span>`; }
                } else { this.render(); }
            }

            scrollToMonth(m, cur) {
                const y = cur ? this.currentYear || 2026 : 2026, el = document.getElementById(`month-header-${y}-${m}`), c = document.getElementById('calendar');
                if (el && c) { const offset = document.querySelector('.sticky-corner').offsetWidth; c.scrollTo({ left: el.offsetLeft - offset, behavior: 'smooth' }); }
            }

            setYear(y) { this.currentYear = y; this.scrollToMonth(0, true); }

            updateNavHighlighting() {
                const c = document.getElementById('calendar'); if (!c) return;
                const d = this.dates[Math.min(Math.floor(c.scrollLeft / 40), this.dates.length - 1)];
                if (d) {
                    this.currentYear = d.year;
                    CONFIG.years.forEach(y => { const b = document.getElementById(`btn-year-${y}`); if (b) b.classList.toggle('primary', y === d.year); });
                    for (let i = 0; i < 12; i++) { const b = document.getElementById(`btn-month-${i}`); if (b) b.classList.toggle('primary', i === d.month); }
                }
            }

            editAbsence(eid, d) {
                if (!this.checkPermission(eid)) return;
                const s = this.state[eid]?.[d]; if (!s) return;
                document.getElementById('modalEmp').value = eid; document.getElementById('modalType').value = (s.type === 'T' ? 'S' : s.type) || 'U'; document.getElementById('modalText').value = s.text || '';
                const vField = document.getElementById('modalVertreter'); if (vField) vField.value = s.vertreter || '';
                document.getElementById('modalStart').value = document.getElementById('modalEnd').value = d; document.getElementById('addModal').style.display = 'flex';
            }

            addRange() {
                const eid = document.getElementById('modalEmp').value, t = document.getElementById('modalType').value, txt = document.getElementById('modalText').value, v = document.getElementById('modalVertreter')?.value || '', s = document.getElementById('modalStart').value, e = document.getElementById('modalEnd').value;
                if (!this.checkPermission(eid)) return;
                let curr = new Date(s), end = new Date(e); if (!this.state[eid]) this.state[eid] = {};
                while (curr <= end) { this.state[eid][this.formatDate(curr)] = { type: t, text: txt, vertreter: v }; curr.setDate(curr.getDate() + 1); }
                this.saveState(); this.render(); document.getElementById('addModal').style.display = 'none';
            }

            openModal() {
                document.getElementById('modalType').value = this.currentMode;
                document.getElementById('modalText').value = ''; document.getElementById('modalVertreter').value = '';
                document.getElementById('addModal').style.display = 'flex';
            }

            showTip(ev, eid, d) {
                const s = eid ? this.state[eid]?.[d] : null, dObj = this.dates.find(x => x.dateStr === d);
                const info = [dObj.holiday, dObj.schoolHoliday].filter(x => x).join(' & ');
                if (!s && !info) return;
                let tip = `<strong>${s ? (s.text || s.type) : ''}</strong>`; if (s && s.vertreter) tip += `<br>Vertreter: ${s.vertreter}`; if (info) tip += `<br>${info}`;
                this.showSimpleTip(ev, tip, true);
            }

            showSimpleTip(ev, text, isHTML = false) {
                const t = document.getElementById('custom-tooltip');
                if (isHTML) t.innerHTML = text;
                else t.innerHTML = `<strong>${text}</strong>`;
                t.style.display = 'block'; t.style.left = ev.clientX + 10 + 'px'; t.style.top = ev.clientY + 10 + 'px';
            }

            hideTip() {
                const t = document.getElementById('custom-tooltip');
                if (t) t.style.display = 'none';
            }

            switchTab(t) { ['calendar', 'summary', 'status', 'admin'].forEach(x => { const v = document.getElementById(x + 'View'); if (v) v.style.display = (x === t ? 'block' : 'none'); }); }
            setMode(m) { this.currentMode = m; }
            setCustomText(t) { this.currentText = t; }
            setVertreterText(t) { this.currentVertreterText = t; }
            saveState() { DataService.save(this.state); }
            exportData() { const d = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.state)); const a = document.createElement('a'); a.href = d; a.download = "assistenz_planer.json"; a.click(); }
        }
        const app = new App();
    </script>
</body>
