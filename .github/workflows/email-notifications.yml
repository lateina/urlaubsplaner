name: Email Notifications

on:
  schedule:
    - cron: '0 6 * * *'  # täglich 07:00 Uhr MEZ / 08:00 Uhr MESZ
  workflow_dispatch:       # manuell auslösbar

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send pending notifications
        env:
          JSONBIN_KEY: ${{ secrets.JSONBIN_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          SEKRETARIAT_EMAIL: ${{ secrets.SEKRETARIAT_EMAIL }}
        run: |
          python3 << 'EOF'
          import json, smtplib, urllib.request, os
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart

          JSONBIN_KEY    = os.environ['JSONBIN_KEY']
          GMAIL_PASSWORD = os.environ['GMAIL_APP_PASSWORD']
          ADMIN_EMAIL       = os.environ['ADMIN_EMAIL']
          SEKRETARIAT_EMAIL = os.environ['SEKRETARIAT_EMAIL']
          GMAIL_USER        = 'dienstereminder@gmail.com'

          BINS = {
              '694548d1d0ea881f403427e3': 'https://lateina.github.io/urlaubsplaner/',
              '699ffb53ae596e708f4b3de5': 'https://lateina.github.io/urlaubsplaner/assistenz.html',
          }
          TYPE_LABELS = {'U': 'Urlaub', 'D': 'Dienstreise', 'F': 'Fortbildung', 'T': 'Sonstiges', 'S': 'Sonstiges'}

          def fetch_bin(bin_id):
              req = urllib.request.Request(
                  f'https://api.jsonbin.io/v3/b/{bin_id}/latest',
                  headers={'X-Master-Key': JSONBIN_KEY}
              )
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())['record']

          def save_bin(bin_id, data):
              body = json.dumps(data).encode()
              req = urllib.request.Request(
                  f'https://api.jsonbin.io/v3/b/{bin_id}',
                  data=body,
                  headers={'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_KEY},
                  method='PUT'
              )
              urllib.request.urlopen(req)

          def send_email(to_email, subject, body_text):
              msg = MIMEMultipart()
              msg['From']    = f'Urlaubsplaner <{GMAIL_USER}>'
              msg['To']      = to_email
              msg['Subject'] = subject
              msg.attach(MIMEText(body_text, 'plain', 'utf-8'))
              with smtplib.SMTP_SSL('smtp.gmail.com', 465) as server:
                  server.login(GMAIL_USER, GMAIL_PASSWORD)
                  server.send_message(msg)
              print(f'  → Mail an {to_email}: {subject}')

          def fmt_dates(dates):
              if not dates: return ''
              return dates[0] if len(dates) == 1 else f"{dates[0]} – {dates[-1]}"

          def find_emp(employees, emp_id):
              return next((e for e in employees if e.get('id') == emp_id), None)

          # Digests über alle Bins sammeln
          admin_digest_lines = []
          sekretariat_digest_lines = []

          for bin_id, app_url in BINS.items():
              print(f'Prüfe Bin {bin_id}...')
              try:
                  data      = fetch_bin(bin_id)
                  employees = data.get('employees', [])
                  state     = data.get('state', {})
                  requests  = state.get('__REQUESTS__', [])
                  changed   = False

                  for req in requests:
                      notified   = req.setdefault('notified', {})
                      status     = req.get('status', '')
                      emp        = find_emp(employees, req.get('empId', ''))
                      vtr        = find_emp(employees, req.get('vertreterId', ''))
                      emp_name   = emp['name'] if emp else req.get('empId', '')
                      dates_str  = fmt_dates(req.get('dates', []))
                      type_label = TYPE_LABELS.get(req.get('type', ''), req.get('type', ''))
                      link       = f'\nZum Urlaubsplaner → Anfragen:\n{app_url}\n'

                      # 1) pending_vertreter → individuelle Mail an Vertreter
                      if status == 'pending_vertreter' and not notified.get('pending_vertreter'):
                          if vtr and vtr.get('email'):
                              try:
                                  send_email(
                                      to_email=vtr['email'],
                                      subject=f'Vertretungsanfrage von {emp_name}',
                                      body_text=(
                                          f"Hallo {vtr['name']},\n\n"
                                          f"{emp_name} beantragt {type_label} und bittet dich um Zustimmung als Vertreter.\n\n"
                                          f"Zeitraum:  {dates_str}\n"
                                          f"Art:       {type_label}\n"
                                          + (f"Hinweis:   {req.get('text')}\n" if req.get('text') else '')
                                          + link +
                                          "-- Automatische Benachrichtigung vom Urlaubsplaner"
                                      )
                                  )
                                  notified['pending_vertreter'] = True
                                  changed = True
                              except Exception as e:
                                  print(f'  ! Fehler (Vertreter-Mail): {e}')
                          else:
                              print(f'  ! Kein E-Mail für Vertreter {req.get("vertreterId")}')

                      # 2) pending_admin → für Digest sammeln
                      if status == 'pending_admin' and not notified.get('pending_admin'):
                          admin_digest_lines.append(
                              f"• {emp_name} | {type_label} | {dates_str} | Vertreter: {req.get('vertreter', '—')}"
                              + (f"\n  Hinweis: {req.get('text')}" if req.get('text') else '')
                              + f"\n  → {app_url}"
                          )
                          notified['pending_admin'] = True
                          changed = True

                      # 3) approved → individuelle Mail an Antragsteller + Sekretariat-Digest
                      if status == 'approved' and not notified.get('approved'):
                          if emp and emp.get('email'):
                              try:
                                  send_email(
                                      to_email=emp['email'],
                                      subject='Dein Antrag wurde genehmigt ✓',
                                      body_text=(
                                          f"Hallo {emp_name},\n\n"
                                          f"Dein Antrag auf {type_label} wurde vom Leitenden Oberarzt genehmigt.\n\n"
                                          f"Zeitraum:  {dates_str}\n"
                                          f"Vertreter: {req.get('vertreter', '')}\n"
                                          + link +
                                          "-- Automatische Benachrichtigung vom Urlaubsplaner"
                                      )
                                  )
                                  notified['approved'] = True
                                  changed = True
                              except Exception as e:
                                  print(f'  ! Fehler (Genehmigungs-Mail): {e}')
                          # Für Sekretariat-Digest sammeln (unabhängig ob emp eine E-Mail hat)
                          if not notified.get('sekretariat'):
                              sekretariat_digest_lines.append(
                                  f"• {emp_name} | {type_label} | {dates_str} | Vertreter: {req.get('vertreter', '—')}"
                                  + (f"\n  Hinweis: {req.get('text')}" if req.get('text') else '')
                              )
                              notified['sekretariat'] = True
                              changed = True

                      # 4) rejected → individuelle Mail an Antragsteller
                      if status == 'rejected' and not notified.get('rejected'):
                          if emp and emp.get('email'):
                              try:
                                  by_label = 'deinem Vertreter' if req.get('rejectedBy') == 'vertreter' else 'dem Leitenden Oberarzt'
                                  send_email(
                                      to_email=emp['email'],
                                      subject='Dein Antrag wurde abgelehnt',
                                      body_text=(
                                          f"Hallo {emp_name},\n\n"
                                          f"Dein Antrag auf {type_label} wurde von {by_label} abgelehnt.\n\n"
                                          f"Zeitraum: {dates_str}\n"
                                          + (f"Grund:    {req.get('rejectionNote')}\n" if req.get('rejectionNote') else '')
                                          + link +
                                          "-- Automatische Benachrichtigung vom Urlaubsplaner"
                                      )
                                  )
                                  notified['rejected'] = True
                                  changed = True
                              except Exception as e:
                                  print(f'  ! Fehler (Ablehnungs-Mail): {e}')

                  if changed:
                      state['__REQUESTS__'] = requests
                      data['state'] = state
                      save_bin(bin_id, data)
                      print(f'  Bin {bin_id} aktualisiert.')

              except Exception as e:
                  print(f'Fehler bei Bin {bin_id}: {e}')

          # Admin-Digest versenden (eine Mail für alle pending_admin-Anfragen)
          if admin_digest_lines:
              try:
                  count = len(admin_digest_lines)
                  send_email(
                      to_email=ADMIN_EMAIL,
                      subject=f'Urlaubsplaner: {count} Antrag{"" if count == 1 else "¨e"} zur Genehmigung',
                      body_text=(
                          f"Guten Morgen,\n\n"
                          f"folgende {count} Antrag{'stellt' if count == 1 else 'stellen'} noch {'eine Entscheidung' if count == 1 else 'Entscheidungen'} aus:\n\n"
                          + "\n\n".join(admin_digest_lines)
                          + "\n\n-- Automatische Benachrichtigung vom Urlaubsplaner"
                      )
                  )
              except Exception as e:
                  print(f'  ! Fehler (Admin-Digest): {e}')
          else:
              print('  Keine offenen Admin-Anfragen.')

          # Sekretariat-Digest versenden
          if sekretariat_digest_lines:
              try:
                  count = len(sekretariat_digest_lines)
                  send_email(
                      to_email=SEKRETARIAT_EMAIL,
                      subject=f'Urlaubsplaner: {count} genehmigte Abwesenheit{"" if count == 1 else "en"} zur PO-Eintragung',
                      body_text=(
                          f"Guten Morgen,\n\n"
                          f"folgende {count} Abwesenheit{'wurde' if count == 1 else 'en wurden'} genehmigt und "
                          f"{'muss' if count == 1 else 'müssen'} noch in PO eingetragen werden:\n\n"
                          + "\n\n".join(sekretariat_digest_lines)
                          + "\n\n-- Automatische Benachrichtigung vom Urlaubsplaner"
                      )
                  )
              except Exception as e:
                  print(f'  ! Fehler (Sekretariat-Digest): {e}')
          else:
              print('  Keine neuen genehmigten Abwesenheiten für Sekretariat.')

          print('Fertig.')
          EOF
